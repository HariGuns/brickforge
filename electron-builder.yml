# Desktop app for Linux, Windows and macOS. Build with: npm run dist (this platform),
# npm run dist:linux | dist:win | dist:mac, or the release workflow on a version tag.
# Unsigned: see "Desktop app" in the README for first-launch warnings.
appId: app.brickforge
productName: BrickForge
copyright: BrickForge contributors
directories:
  app: electron
  output: dist
  buildResources: electron
files:
  - main.cjs
  - package.json
  - icon.png
  - build-info.json
  - "!**/node_modules/**"
# The app itself has no dependencies; the server brings its own node_modules.
npmRebuild: false
nodeGypRebuild: false
# The standalone server (.next-app/standalone) is copied into the app's resources here.
afterPack: scripts/electron-after-pack.cjs
linux:
  target: AppImage
  executableName: brickforge
  icon: electron/icon.png
  category: Graphics
  synopsis: Turn a description or photo into a buildable brick model
  artifactName: BrickForge-${version}-${arch}.AppImage
  desktop:
    entry:
      Name: BrickForge
      StartupWMClass: BrickForge
win:
  icon: electron/icon.png
  target: [nsis, portable]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: BrickForge-Setup-${version}.exe
portable:
  artifactName: BrickForge-${version}-portable.exe
mac:
  icon: electron/icon.png
  category: public.app-category.graphics-design
  target: dmg
  identity: null
  artifactName: BrickForge-${version}-universal.dmg
publish: null
