# Builds the desktop app on a version tag (v0.1.0, …) and attaches it to that tag's GitHub Release:
# Linux AppImage, Windows installer + portable .exe, macOS universal .dmg. Unsigned.
# No API key is involved: the app asks for one on first launch, and the packaging script
# refuses to package anything shaped like an Anthropic key.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            files: dist/*.AppImage
          - os: windows-latest
            target: win
            files: dist/*.exe
          - os: macos-latest
            target: mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: brickforge-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.files }}
          draft: true
          name: BrickForge ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
